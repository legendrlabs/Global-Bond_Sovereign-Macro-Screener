name: Stable program release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Require a main commit and matching stable version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          PYTHONPATH=src python - <<'PY'
          import os, re, tomllib
          from sovereign_macro import __version__
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert re.fullmatch(r'(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)',version)
          assert __version__==version and os.environ['GITHUB_REF_NAME']=='v'+version
          PY
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m sovereign_macro demo --output results/demo --public-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stable-wheel
          path: dist
      - name: Publish verified program asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl --verify-tag --generate-notes
