name: Preview program release
on:
  push:
    branches: ['release-preview/v0.1.0-preview.4']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify preview identity
        run: |
          PYTHONPATH=src python - <<'PY'
          import os, tomllib
          from sovereign_macro import __version__
          assert os.environ['GITHUB_REF_NAME']=='release-preview/v0.1.0-preview.4'
          assert tomllib.load(open('pyproject.toml','rb'))['project']['version']==__version__=='0.1.0'
          PY
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m sovereign_macro demo --output results/demo --public-output
      - name: Package source and checksums
        run: |
          git archive --format=zip --prefix=sovereign-macro/ HEAD -o dist/sovereign-macro-v0.1.0-preview.4.zip
          cd dist
          sha256sum *.whl *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-package
          path: dist
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/v0.1.0-preview.4" >/dev/null 2>&1; then
            echo 'Preview tag already exists; refusing to reuse its target.'
            exit 1
          fi
          gh release create v0.1.0-preview.4 dist/* --target "$RELEASE_COMMIT" --prerelease --title "v0.1.0-preview.4 — Baseline 비교·시장 품질 진단 시험판" --notes 'Python 3.11+ 시험판. PR #4의 검수 수정과 공식 5년물 Baseline 비교를 반영했습니다. 한국·미국·일본의 금리 정의 차이를 표시하며 연복리 환산 수익률 순위가 아닌 탐색용 명목 금리 비교입니다. BIS 시장 규모 입력은 국가별 오류를 격리하고, WGB S&P 표기는 등급 종류가 확인되지 않아 점수에 반영하지 않습니다. 시장 품질의 유동성·접근성 자료 후보와 결측을 보고하며 Adjusted 순위는 입력 검증 전까지 보류합니다. 합성 데모의 근거 수치·메모 제거와 품질 표시를 수정했습니다. API 키는 요구하지 않습니다. 공개 보고서는 재배포 허가 미확인 수치를 숨기며 원자료와 개인 보고서는 배포에 포함하지 않습니다. 전체 166개 테스트, wheel 설치, 공개 demo를 검증한 뒤 게시합니다. 내부 패키지 버전은 0.1.0으로 이전 시험판에서 설치할 때 --force-reinstall을 사용하세요.'
