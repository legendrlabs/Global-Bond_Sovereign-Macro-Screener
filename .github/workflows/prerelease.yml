name: Preview program release
on:
  push:
    branches: ['release-preview/v0.1.0-preview.5']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify preview identity
        run: |
          PYTHONPATH=src python - <<'PY'
          import os, tomllib
          from sovereign_macro import __version__
          assert os.environ['GITHUB_REF_NAME']=='release-preview/v0.1.0-preview.5'
          assert tomllib.load(open('pyproject.toml','rb'))['project']['version']==__version__=='0.1.0'
          PY
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m sovereign_macro demo --output results/demo --public-output
      - name: Package source and checksums
        run: |
          git archive --format=zip --prefix=sovereign-macro/ HEAD -o dist/sovereign-macro-v0.1.0-preview.5.zip
          cd dist
          sha256sum *.whl *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-package
          path: dist
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/v0.1.0-preview.5" >/dev/null 2>&1; then
            echo 'Preview tag already exists; refusing to reuse its target.'
            exit 1
          fi
          gh release create v0.1.0-preview.5 dist/* --target "$RELEASE_COMMIT" --prerelease --title "v0.1.0-preview.5 — 미국·일본 유동성 진단 시험판" --notes 'Python 3.11+ 프리릴리즈. PR #5와 2차 검수 수정(e300e05)을 반영했습니다. API 키 없이 NY Fed 미국 거래량과 JSDA 일본 장외거래량을 수집해 출처별 유동성 진단을 표시합니다. 미국 주간 일평균 USD 백만과 일본 월간 매도+매수 JPY 억엔은 단위·집계 범위를 그대로 유지하며 국가 간 점수로 환산하지 않습니다. BIS만 끄는 size_enabled 설정, IMF 전용 전송 인자 분리, 일본 엑셀 연간 합계 제외·크기 제한, 데모 출처 정보 제거를 포함합니다. 한국 유동성은 빈 응답으로 아직 미연결입니다. Market Quality 및 Adjusted 순위는 계속 보류합니다. 전체 181개 테스트, wheel 설치 및 공개 demo를 검증한 뒤 게시합니다. 원자료와 개인 보고서는 포함하지 않으며 공개 출력은 재배포 허가 미확인 수치를 숨깁니다. 내부 패키지 버전은 0.1.0이므로 이전 시험판에서 설치할 때 --force-reinstall을 사용하세요.'
