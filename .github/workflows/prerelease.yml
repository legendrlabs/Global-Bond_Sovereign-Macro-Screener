name: Preview program release
on:
  push:
    branches: ['release-preview/v0.1.0-preview.1']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify preview identity
        run: |
          PYTHONPATH=src python - <<'PY'
          import os, tomllib
          from sovereign_macro import __version__
          assert os.environ['GITHUB_REF_NAME']=='release-preview/v0.1.0-preview.1'
          assert tomllib.load(open('pyproject.toml','rb'))['project']['version']==__version__=='0.1.0'
          PY
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m sovereign_macro demo --output results/demo --public-output
      - name: Package source and checksums
        run: |
          git archive --format=zip --prefix=sovereign-macro/ HEAD -o dist/sovereign-macro-v0.1.0-preview.1.zip
          cd dist
          sha256sum *.whl *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-package
          path: dist
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/v0.1.0-preview.1" >/dev/null 2>&1; then
            echo 'Preview tag already exists; refusing to reuse its target.'
            exit 1
          fi
          gh release create v0.1.0-preview.1 dist/* --target "$RELEASE_COMMIT" --prerelease --title "v0.1.0-preview.1 — WGB·IMF 보완 시험판" --notes 'Python 3.11+ 시험판입니다. 소스 ZIP을 풀고 README의 설치 안내를 따라 실행하세요. 프로그램·자료 갱신은 실행 시 각각 확인받습니다. 자동 프로그램 업데이트는 정식 릴리스만 확인하며 이 시험판은 직접 설치합니다. 27개국 5년물은 공식 경로 우선, 검증된 WGB 보완 경로를 사용합니다. 검증된 WGB 금리는 Baseline 입력에 사용하고 WGB 출처와 관측일을 표시합니다. IMF 연결 실패 시 검증된 같은 발표판 저장본을 재사용합니다. 미연결·정의 불일치·자료 지연은 DATA_HOLD로 표시합니다. 제공기관 재배포 허가가 확인되지 않은 수치는 공개 보고서에서 숨깁니다. 원자료와 개인 보고서는 배포물에 포함하지 않습니다.'
